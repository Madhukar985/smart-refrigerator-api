<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartFridge</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3"
                    style="width: 48px; height: 48px; font-size: 1.25rem;">
                    <i class="fa-solid fa-snowflake"></i>
                </div>
                <h2>Welcome Back</h2>
                <p class="text-muted small">Enter your details to sign in to your account</p>
            </div>

            <div id="alertPlaceholder"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                </div>

                <div class="mb-4">
                    <label class="form-label mb-1" for="password">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control border-end-0" id="password" required
                            placeholder="Enter your password">
                        <button class="btn btn-outline-secondary bg-white border-start-0" type="button" id="togglePassword">
                            <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3 py-2">Sign in</button>

                <div class="text-center">
                    <p class="text-muted small mb-3">
                        Don't have an account? <a href="register.html"
                            class="text-decoration-none fw-medium text-primary">Sign up</a>
                    </p>
                    <a href="index.html" class="text-muted small text-decoration-none"><i
                            class="fa-solid fa-arrow-left me-1"></i>Back to Home</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }

        // Toggle Password Visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const alertPlaceholder = document.getElementById('alertPlaceholder');

            // Simple styling for alert
            const showAlert = (message, type) => {
                const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
                const bgColor = type === 'success' ? '#d1fae5' : '#fee2e2';
                const color = type === 'success' ? '#065f46' : '#991b1b';

                alertPlaceholder.innerHTML = `
                    <div class="alert mb-3 border-0 d-flex align-items-center" style="background-color: ${bgColor}; color: ${color};">
                        <i class="fa-solid ${icon} me-2"></i>
                        <span>${message}</span>
                    </div>
                `;
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Save token to localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    showAlert('Signed in successfully', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showAlert(data.msg || 'Invalid Credentials', 'danger');
                }
            } catch (err) {
                showAlert('Server Error. Please try again later.', 'danger');
            }
        });
    </script>
</body>

</html>
