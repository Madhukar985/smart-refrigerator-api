<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartFridge</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 450px;">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3" style="width: 48px; height: 48px; font-size: 1.25rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p class="text-muted small">Fill in your details to get started</p>
            </div>
            
            <div id="alertPlaceholder"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" class="form-control" id="name" required placeholder="John Doe">
                </div>
                
                <div class="mb-3">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                </div>
                
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Create a password">
                    <div class="text-muted mt-1" style="font-size: 0.75rem;"><i class="fa-solid fa-circle-info me-1"></i>Min 8 chars, 1 uppercase, 1 symbol.</div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required placeholder="Confirm your password">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3 py-2">Create Account</button>
                
                <div class="text-center">
                    <p class="text-muted small mb-3">
                        Already have an account? <a href="login.html" class="text-decoration-none fw-medium text-primary">Sign in</a>
                    </p>
                    <a href="index.html" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Back to Home</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const alertPlaceholder = document.getElementById('alertPlaceholder');
            
            // Simple styling for alert
            const showAlert = (message, type) => {
                const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
                const bgColor = type === 'success' ? '#d1fae5' : '#fee2e2';
                const color = type === 'success' ? '#065f46' : '#991b1b';
                
                alertPlaceholder.innerHTML = `
                    <div class="alert mb-3 border-0 d-flex align-items-center" style="background-color: ${bgColor}; color: ${color};">
                        <i class="fa-solid ${icon} me-2"></i>
                        <span>${message}</span>
                    </div>
                `;
            };
            
            // Password validation pattern
            const passwordRegex = /^(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
            
            if (!passwordRegex.test(password)) {
                showAlert('Password must be at least 8 characters, contain at least one uppercase letter and one special symbol.', 'danger');
                return;
            }
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match.', 'danger');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert('Registration Successful. Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.msg || 'Registration failed', 'danger');
                }
            } catch (err) {
                showAlert('Server Error. Please try again later.', 'danger');
            }
        });
    </script>
</body>
</html>
